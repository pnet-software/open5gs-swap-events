spring:
  application:
    name: open5gs-swap-events
  mongodb:
    uri: ${MONGODB_URI}
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 10s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        # Restarting the pod fixes a stuck poller, not a Mongo outage
        liveness:
          include: livenessState,poller
        readiness:
          include: readinessState,mongo

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
  level:
    root: ${LOG_LEVEL:INFO}

swapchecks:
  poll-interval: ${POLL_INTERVAL:30s}
  stall-timeout: ${STALL_TIMEOUT:10m}
